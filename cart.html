<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Horlogerie Élite</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>

<header>
  <div class="container">
    <a href="index.html" class="logo">Horlogerie <span>Élite</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalog.html">Collections</a>
      <a href="catalog.html?brand=rolex">Rolex</a>
      <a href="catalog.html?brand=omega">Omega</a>
      <a href="#">About</a>
      <a href="cart.html" class="active">Cart<span class="cart-nav-count" id="cartNavCount" style="display:none">0</span></a>
    </nav>
    <div class="header-actions"></div>
  </div>
</header>

<div class="page-hero" style="padding-bottom:40px">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Home</a><span>›</span>
      <span>Shopping Cart</span>
    </div>
    <h1 style="margin-top:20px">Your Cart</h1>
  </div>
</div>

<section class="section" style="padding-top:40px">
  <div class="container">
    <div id="cartContent"></div>
  </div>
</section>

<!-- You might also like -->
<section class="section" style="padding-top:0" id="alsoLikeSection">
  <div class="container">
    <div class="divider" style="margin-bottom:56px"></div>
    <div class="section-header">
      <h2>Frequently Bought Together</h2>
      <p>Customers who purchased items in your cart also bought these.</p>
    </div>
    <div class="product-grid product-grid-4" id="alsoLikeGrid"></div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <span>© 2025 Horlogerie Élite Ltd. All rights reserved.</span>
    </div>
  </div>
</footer>

<div class="mode-badge" id="modeBadge"></div>

<script src="data.js"></script>
<script>
  updateCartBadge();
  setModeBadge();

  function renderCart() {
    const cart = getCart();
    const content = document.getElementById('cartContent');

    if (cart.length === 0) {
      content.innerHTML = `
        <div style="text-align:center; padding:80px 0">
          <div style="font-size:3rem; margin-bottom:20px; opacity:0.3">🛒</div>
          <h2 class="serif" style="margin-bottom:12px">Your cart is empty</h2>
          <p class="muted" style="margin-bottom:32px">Discover our curated collection of luxury timepieces.</p>
          <a href="catalog.html" class="btn btn-primary btn-lg">Browse Watches</a>
        </div>`;
      document.getElementById('alsoLikeSection').style.display = 'none';
      return;
    }

    const subtotal = cartTotal();
    const shipping = subtotal > 5000 ? 0 : 25;
    const insurance = Math.round(subtotal * 0.015);
    const total = subtotal + shipping;

    content.innerHTML = `
      <div class="cart-layout">
        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h3 class="serif">${cart.length} item${cart.length !== 1 ? 's' : ''} in your cart</h3>
            <a href="catalog.html" class="btn btn-ghost" style="font-size:0.82rem">← Continue Shopping</a>
          </div>
          <div class="cart-items" id="cartItems">
            ${cart.map(item => `
              <div class="cart-item" id="item-${item.id}">
                <div class="cart-item-img">
                  <img src="${item.img}" alt="${item.name}" />
                </div>
                <div>
                  <div class="cart-item-brand">${item.brand}</div>
                  <div class="cart-item-name">${item.name}</div>
                  ${item.ref ? `<div class="cart-item-ref">${item.ref}</div>` : ''}
                  <button class="remove-btn" onclick="handleRemove('${item.id}')">Remove</button>
                </div>
                <div style="text-align:right">
                  <div class="cart-item-price">£${(item.price * item.qty).toLocaleString()}</div>
                  <div class="muted" style="font-size:0.8rem; margin-top:4px">Qty: ${item.qty}</div>
                </div>
              </div>`).join('')}
          </div>

          <!-- Trust signals under cart -->
          <div style="display:flex; gap:24px; flex-wrap:wrap; margin-top:28px; padding:20px; background:var(--surface); border:1px solid var(--border); border-radius:4px">
            <div class="guarantee-item" style="font-size:0.82rem; color:var(--muted)">
              <span style="color:var(--gold)">✦</span> Authenticity guaranteed
            </div>
            <div class="guarantee-item" style="font-size:0.82rem; color:var(--muted)">
              <span style="color:var(--gold)">◈</span> Fully insured shipping
            </div>
            <div class="guarantee-item" style="font-size:0.82rem; color:var(--muted)">
              <span style="color:var(--gold)">⟳</span> 30-day return policy
            </div>
          </div>
        </div>

        <!-- Order summary -->
        <div class="order-summary">
          <h3>Order Summary</h3>

          <div class="coupon-row">
            <input type="text" class="coupon-input" placeholder="Discount / promo code" />
            <button class="btn btn-outline" style="white-space:nowrap; font-size:0.8rem; padding:10px 16px" onclick="showToast('Invalid or expired code')">Apply</button>
          </div>

          <div class="summary-row">
            <span class="muted">Subtotal</span>
            <span>£${subtotal.toLocaleString()}</span>
          </div>
          <div class="summary-row">
            <span class="muted">Shipping</span>
            <span>${shipping === 0 ? '<span style="color:var(--gold)">Free</span>' : '£' + shipping}</span>
          </div>
          <div class="summary-row">
            <span class="muted" style="display:flex; align-items:center; gap:6px">
              Transit insurance
              <span style="font-size:0.7rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1px 6px; cursor:help" title="Optional transit insurance covers loss or damage in transit">?</span>
            </span>
            <span class="muted" style="font-size:0.85rem">+£${insurance}</span>
          </div>
          <div class="summary-row">
            <span class="muted">VAT (20%)</span>
            <span class="muted" style="font-size:0.85rem">Included</span>
          </div>
          <div class="summary-row total" style="margin-top:8px; padding-top:16px; border-top:1px solid var(--border)">
            <span>Total</span>
            <span>£${total.toLocaleString()}</span>
          </div>

          <a href="checkout.html?step=1" class="btn btn-primary btn-lg btn-full" style="margin-top:24px">
            Proceed to Checkout
          </a>
          <p class="form-note" style="margin-top:12px">
            Secure checkout · SSL encrypted
          </p>

          <div style="display:flex; justify-content:center; gap:12px; margin-top:16px; opacity:0.5; font-size:1.3rem">
            💳 🔒 🛡️
          </div>
        </div>
      </div>`;
  }

  function handleRemove(id) {
    removeFromCart(id);
    renderCart();
    renderAlsoLike();
  }

  function renderAlsoLike() {
    const cart = getCart();
    const cartIds = cart.map(i => i.id);
    const suggestions = WATCHES.filter(w => !cartIds.includes(w.id)).slice(0, 4);
    if (suggestions.length === 0) {
      document.getElementById('alsoLikeSection').style.display = 'none';
      return;
    }
    document.getElementById('alsoLikeGrid').innerHTML = suggestions.map(w => `
      <a href="product.html?id=${w.id}" class="card product-card">
        <div class="product-card-img">
          <img src="${w.img}" alt="${w.name}" loading="lazy" />
          ${w.badge ? `<span class="product-badge">${w.badge}</span>` : ''}
        </div>
        <div class="product-card-body">
          <div class="product-brand">${w.brand}</div>
          <div class="product-name">${w.name}</div>
          <div class="product-price">£${w.price.toLocaleString()}</div>
        </div>
      </a>`).join('');
  }

  renderCart();
  renderAlsoLike();
</script>
</body>
</html>
